<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Yomite: Create an Account</title>
        <link rel="icon" type="image/x-icon" href="/WD3_Project_Sem2_MangaWebsite/Project/images/website-icon.png">
        <link rel="stylesheet" href="/WD3_Project_Sem2_MangaWebsite/Project/css/register.css">
    </head>
    <body>

        <!-- ---------- LEFT PANEL ---------- -->
        <div class="auth-left">
            <div class="auth-left-kanji">読み手</div>
            <div class="auth-brand">
                <a href="/WD3_Project_Sem2_MangaWebsite/Project/index.php">
                    <div class="auth-brand-logo">Yomite<span>.</span></div>
                </a>
                <div class="auth-brand-tagline">Stories Made For You</div>
                <div class="auth-brand-divider"></div>
                <p class="auth-brand-desc">Discover, collect, and read anything from around the world.</p>
            </div>
        </div>

        <!-- ---------- RIGHT PANEL ---------- -->
        <div class="auth-content">

            <form id="register-form" method="POST">

                <div class="form-heading">
                    <h2>Create an Account</h2>
                    <p>Fill in your details below to get started.</p>
                </div>
                
                <!-- ---------- personal info ---------- -->
                <label for="first-name">First Name</label>
                <input type="text" id="first-name" name="first-name" placeholder="John" required>

                <label for="last-name">Last Name</label>
                <input type="text" id="last-name" name="last-name" placeholder="Doe" required>

                <label for="date-of-birth">Date of Birth</label>
                <input type="date" id="date-of-birth" name="date-of-birth" required>
                <span id="dob-status" style="font-size:0.8rem;"></span>

                <!-- ---------- gender ---------- -->
                <label>Gender</label>
                <div class="radio-group">
                    <label class="radio-label"><input type="radio" name="gender" value="male"> Male</label>
                    <label class="radio-label"><input type="radio" name="gender" value="female"> Female</label>
                    <label class="radio-label"><input type="radio" name="gender" value="other"> Other</label>
                </div>

                <!-- ---------- account info ---------- -->
                <label for="email-address">Email Address</label>
                <input type="text" id="email-address" name="email-address" placeholder="chaoticfriedrice@example.com" required>
                <span id="email-status"></span>

                <label for="username">Username</label>
                <div class="input-prefix">
                    <span>@</span>
                    <input type="text" id="username" name="username" placeholder="ChaoticFriedRice" required>
                </div>
                <span id="username-status"></span>

                <!-- ---------- password ---------- -->
                <label for="password">Password</label>
                <div class="input-suffix">
                    <input type="password" id="password" name="password" placeholder="••••••••••••" required>
                    <span class="show-btn" onclick="togglePassword('password', this)">Show</span>
                </div>
                <span id="password-status" style="font-size:0.8rem;"></span>

                <label for="confirm-password">Confirm Password</label>
                <div class="input-suffix">
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="••••••••••••" required>
                    <span class="show-btn" onclick="togglePassword('confirm-password', this)">Show</span>
                </div>
                <span id="confirm-status" style="font-size:0.8rem;"></span>

                <!-- ---------- terms ---------- -->
                <label class="auth-check">
                    <input type="checkbox" id="terms" required>
                    I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy.</a>
                </label>

                <!-- ---------- error ---------- -->
                <div id="form-error" style="display:none;"></div>

                <!-- ---------- submit ---------- -->
                <button type="submit">Create Account</button>
                <button type="button" onclick="document.getElementById('register-form').reset()">Cancel</button>

            </form>

            <div class="auth-switch">
                Already have an account? <a href="/WD3_Project_Sem2_MangaWebsite/Project/pages/login.html">Login here!</a>
            </div>

        </div>

        <script src="/WD3_Project_Sem2_MangaWebsite/Project/js/register.js"></script>
    </body>
</html>
